            ".cat-chip { background-color: #1a1a1a; color: white; padding: 5px 12px; border-radius: 15px; font-size: 12px; }" +
            ".products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 15px; text-align: center; }" +
