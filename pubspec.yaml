            "body { background-color: #eaf2f8; padding: 10px; display: flex; justify-content: center; }" +
            ".phone-frame { width: 100%; max-width: 380px; background-color: #eaf2f8; border-radius: 20px; overflow: hidden; }" +
            ".app-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #eaf2f8; }" +
            ".profile-section { display: flex; align-items: center; gap: 8px; }" +
            ".avatar { width: 35px; height: 35px; background-color: #ffb6c1; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }" +
            ".app-title { font-size: 16px; font-weight: bold; color: #000; }" +
